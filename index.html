<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website Intro</title>
    <style>
        /* === RESET & BASIC STYLES === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body, html {
            background-color: #050505;
            color: white;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* === 1. THUNDERBOLT INTRO SCREEN === */
        #thunder-intro {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: thunderFlash 3s forwards;
            transition: opacity 0.8s ease, visibility 0.8s;
        }
        .glitch-text {
            font-size: 4rem;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            text-align: center;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
            animation: textTremble 0.2s infinite;
        }

        @keyframes thunderFlash {
            0% { background: #000; }
            5% { background: #fff; }
            10% { background: #000; }
            12% { background: #fff; }
            15% { background: #000; }
            50% { background: #000; }
            52% { background: #fff; }
            55% { background: #000; }
            100% { background: #000; }
        }
        @keyframes textTremble {
            0% { transform: translate(1px, 1px) }
            50% { transform: translate(-1px, -1px) }
            100% { transform: translate(1px, 1px) }
        }

        /* === 2. SCROLL SECTION (Welcome to My World) === */
        .welcome-section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
        }
        .welcome-section h1 {
            font-size: 5rem;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            margin-bottom: 20px;
        }
        .scroll-indicator {
            font-size: 1.5rem;
            color: #0ff;
            animation: bounce 1.5s infinite;
            letter-spacing: 2px;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(15px); }
        }

        /* === 3. THE DOOR ANIMATION SECTION === */
        .door-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #ffffff; /* Tumhari actual website ka background color */
        }
        
        /* The Content Inside The Room (TUMHARI WEBSITE YAHA AAYEGI) */
        .inside-world {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #000; /* Dark text for light background */
            z-index: 1;
        }
        .inside-world h2 {
            font-size: 4rem;
            color: #003366; /* Corporate blue */
            margin-bottom: 10px;
        }
        .inside-world p {
            font-size: 1.2rem;
            color: #555;
            font-weight: bold;
        }

        /* The Doors */
        .door {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(135deg, #111, #222);
            z-index: 5;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
            transition: transform 1.8s cubic-bezier(0.77, 0, 0.175, 1);
            display: flex;
            align-items: center;
        }
        .door-left {
            left: 0;
            border-right: 2px solid #0ff;
            box-shadow: 5px 0 15px rgba(0, 255, 255, 0.3);
            transform-origin: left;
        }
        .door-right {
            right: 0;
            border-left: 2px solid #0ff;
            box-shadow: -5px 0 15px rgba(0, 255, 255, 0.3);
            transform-origin: right;
        }

        /* The Simple Hands */
        .hand {
            position: absolute;
            top: 120vh; /* Hidden below initially */
            width: 30px;
            height: 80px;
            background: #0ff;
            border-radius: 10px;
            box-shadow: 0 0 20px #0ff;
            transition: top 0.6s ease-out; /* Slide up speed */
            z-index: 10;
        }
        
        .door-left .hand { right: -15px; }
        .door-right .hand { left: -15px; }

        /* === ANIMATION CLASSES === */
        .door-wrapper.grab .hand {
            top: 50%; 
            transform: translateY(-50%);
        }
        .door-wrapper.pull .door-left {
            transform: translateX(-100%);
        }
        .door-wrapper.pull .door-right {
            transform: translateX(100%);
        }
    </style>
</head>
<body>

    <!-- THUNDER INTRO -->
    <div id="thunder-intro">
        <h1 class="glitch-text">Glad you are here</h1>
    </div>

    <!-- WELCOME SECTION -->
    <div class="welcome-section">
        <h1>Welcome to My World</h1>
        <div class="scroll-indicator">SCROLL DOWN <span>▼</span></div>
    </div>

    <!-- DOOR SECTION & WEBSITE CONTENT -->
    <div class="door-wrapper" id="door-section">
        
        <!-- Yaha se tumhari website shuru hogi -->
        <div class="inside-world">
            <h2>esampark.biz</h2>
            <p>Private Corporate Platform</p>
            <br>
            <p style="color: #888; font-size: 1rem;">(Bhai yaha par tu apni website ka code ya iframe daal dena)</p>
        </div>

        <!-- Left Door & Hand -->
        <div class="door door-left">
            <div class="hand"></div>
        </div>

        <!-- Right Door & Hand -->
        <div class="door door-right">
            <div class="hand"></div>
        </div>

    </div>

    <!-- Extra space so user can scroll down into your actual website -->
    <div style="height: 100vh; background: #ffffff;"></div>

    <script>
        // 1. Remove Thunder Screen after 3 Seconds
        setTimeout(() => {
            const intro = document.getElementById('thunder-intro');
            intro.style.opacity = '0';
            intro.style.visibility = 'hidden';
            setTimeout(() => intro.remove(), 800); 
        }, 3000);

        // 2. Door Open Animation on Scroll
        const doorSection = document.getElementById('door-section');
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    
                    // Hath pakdenge
                    doorSection.classList.add('grab');

                    // 0.8 sec baad darwaza khulega aur website dikhegi
                    setTimeout(() => {
                        doorSection.classList.add('pull');
                    }, 800);

                    observer.unobserve(doorSection);
                }
            });
        }, { threshold: 0.6 }); 

        observer.observe(doorSection);
    </script>

</body>
</html>
